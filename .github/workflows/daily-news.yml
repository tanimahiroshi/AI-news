name: Daily Self-Storage News

on:
  workflow_dispatch:
    inputs:
      use_sample_data:
        description: 'fixtures/sample-news.json を使って動作確認する（RSS取得なし）'
        type: boolean
        default: false
  schedule:
    # 毎日 08:00 JST（UTC 23:00）。日本はサマータイムなしのため固定オフセット。
    - cron: '0 23 * * *'

permissions:
  contents: read

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - run: npm start
        env:
          USE_SAMPLE_DATA: ${{ github.event_name == 'workflow_dispatch' && inputs.use_sample_data == true && 'true' || 'false' }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}

      - name: Notify failure to Google Chat
        if: failure()
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          FAILED_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "$GOOGLE_CHAT_WEBHOOK_URL" \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d "{\"text\": \"❌ Daily Self-Storage News が失敗しました。ワークフローを確認してください: ${FAILED_RUN_URL}\"}"
