name: Daily Self-Storage News

on:
  workflow_dispatch:
    inputs:
      use_sample_data:
        description: 'fixtures/sample-news.json を使って動作確認する（RSS取得なし）'
        type: boolean
        default: false
  schedule:
    # 毎日 08:00 JST（UTC 23:00）。日本はサマータイムなしのため固定オフセット。
    - cron: '0 23 * * *'
    # バックアップ実行: 毎日 10:00 JST（UTC 01:00）
    - cron: '0 1 * * *'

permissions:
  contents: read

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Set today's date (JST)
        id: date
        run: echo "TODAY=$(TZ=Asia/Tokyo date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Check if already delivered today
        id: delivery_cache
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .cache/delivered
          key: news-delivered-${{ steps.date.outputs.TODAY }}
          lookup-only: true

      - name: Skip duplicate schedule delivery
        if: github.event_name == 'schedule' && steps.delivery_cache.outputs.cache-hit == 'true'
        run: echo "本日は既に配信済みのためスキップします。"

      - run: npm start
        if: github.event_name != 'schedule' || steps.delivery_cache.outputs.cache-hit != 'true'
        env:
          USE_SAMPLE_DATA: ${{ github.event_name == 'workflow_dispatch' && inputs.use_sample_data == true && 'true' || 'false' }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}

      - name: Prepare delivery marker
        if: (github.event_name != 'schedule' || steps.delivery_cache.outputs.cache-hit != 'true') && success()
        run: |
          mkdir -p .cache/delivered
          echo "delivered_at=$(TZ=Asia/Tokyo date --iso-8601=seconds)" > ".cache/delivered/${{ steps.date.outputs.TODAY }}.txt"

      - name: Save delivery cache
        if: (github.event_name != 'schedule' || steps.delivery_cache.outputs.cache-hit != 'true') && success()
        uses: actions/cache/save@v4
        with:
          path: .cache/delivered
          key: news-delivered-${{ steps.date.outputs.TODAY }}

      - name: Notify failure to Google Chat
        if: failure()
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          FAILED_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "$GOOGLE_CHAT_WEBHOOK_URL" \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d "{\"text\": \"❌ Daily Self-Storage News が失敗しました。ワークフローを確認してください: ${FAILED_RUN_URL}\"}"
